name: Phone Number Validation

on:
  # Run every day at 14:00 UTC (after midnight scrapers)
  schedule:
    - cron: "0 14 * * *"

  workflow_dispatch:
    inputs:
      date:
        description: "Date (YYYY-MM-DD, default: yesterday UTC)"
        required: false
        type: string
        default: ""
      prefix:
        description: "R2 folder prefix"
        required: false
        type: string
        default: "boshamlan-data/"
      show_invalid:
        description: "How many invalid samples to print"
        required: false
        type: string
        default: "50"
      fail_on_invalid:
        description: "Fail the workflow if any invalid phones are found"
        required: false
        type: boolean
        default: false

jobs:
  validate-phones:
    name: Validate Phones
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve date
        id: date
        run: |
          if [[ -n "${{ github.event.inputs.date }}" ]]; then
            DATE="${{ github.event.inputs.date }}"
          else
            DATE="$(date -u -d 'yesterday' +%Y-%m-%d)"
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Using date: $DATE"

      - name: Validate phone numbers
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          PREFIX="${{ github.event.inputs.prefix }}"
          if [[ -z "$PREFIX" ]]; then
            PREFIX="boshamlan-data/"
          fi

          SHOW_INVALID="${{ github.event.inputs.show_invalid }}"
          if [[ -z "$SHOW_INVALID" ]]; then
            SHOW_INVALID="50"
          fi

          FLAGS="--date ${{ steps.date.outputs.date }}"
          FLAGS="$FLAGS --prefix $PREFIX"
          FLAGS="$FLAGS --show-invalid $SHOW_INVALID"
          FLAGS="$FLAGS --output phone_validation_report.json"

          if [[ "${{ github.event.inputs.fail_on_invalid }}" == "true" ]]; then
            FLAGS="$FLAGS --fail-on-invalid"
          fi

          echo "Running: python -m validation.validate_phones $FLAGS"
          python -m validation.validate_phones $FLAGS

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-validation-report
          path: phone_validation_report.json
          if-no-files-found: ignore
